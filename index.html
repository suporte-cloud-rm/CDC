<!doctype html>
<html lang="pt-BR">
<head>
  <meta name="robots" content="noindex, nofollow" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Central de Conhecimento - Suporte Cloud (RM)</title>
  <style>
    :root {
      --bg: #0b0f19; 
      --card: #121a2a; 
      --muted: #9aa7bd; 
      --text: #e8eefc;
      --accent: #5aa7ff;
      --highlight: #ffffff; 
      --border: rgba(90, 167, 255, 0.15);
      --breadcrumb-green: #20c997;
      --danger: #ff5252;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
    header { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px); background: rgba(11,15,25,.85); border-bottom: 1px solid var(--border); }
    
    .wrap { max-width: 1700px; width: 96%; margin: 0 auto; padding: 16px; }
    
    .top { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .brand { font-weight: 700; font-size: 18px; }
    
    .actions-top { display: flex; gap: 8px; align-items: center; }

    .btn-action {
      background: #1a263d;
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-action:hover { background: #223250; border-color: rgba(90, 167, 255, 0.4); }

    .searchRow { display: flex; gap: 10px; margin-top: 12px; align-items: center; position: relative; }
    
    .search-input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      margin: 0;
      padding: 0;
    }

    input.search-box { 
      width: 100%; 
      background: var(--card); 
      color: var(--text); 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      padding: 12px 38px 12px 14px; 
      outline: none; 
      font-size: 15px; 
    }

    .btn-clear-search {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .btn-clear-search:hover { color: var(--text); }

    #fileInput { display: none; }

    main { padding: 18px 0 40px; }
    
    .grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
    @media (min-width: 992px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }

    .grid-thumbnails {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    @media (min-width: 1200px) {
      .grid-thumbnails {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    
    .card { 
      background: var(--card); 
      border: 1px solid var(--border); 
      border-radius: 14px; 
      padding: 24px; 
      display: flex; 
      flex-direction: column; 
      gap: 6px; 
      transition: border-color 0.2s ease;
      height: 100%;
    }
    .card:hover { border-color: rgba(90, 167, 255, 0.4); }

    .card-thumb {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      cursor: pointer;
      align-items: flex-start;
      height: fit-content;
    }
    .card-thumb:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(90, 167, 255, 0.1);
      background: #151e2e;
      z-index: 10;
    }
    .thumb-path {
      color: var(--breadcrumb-green);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
    .thumb-title {
      color: var(--text);
      font-size: 15px; 
      font-weight: 600;
      line-height: 1.3;
      transition: color 0.2s;
    }
    .card-thumb:hover .thumb-title { color: var(--accent); }

    .thumb-sub-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      margin-top: 0;
      padding-top: 0;
      border-top: 1px dashed transparent;
      transition: max-height 0.2s ease 0s, opacity 0.2s ease 0s, margin-top 0.2s ease 0s, padding-top 0.2s ease 0s, border-color 0.2s ease 0s;
    }
    .card-thumb:hover .thumb-sub-list {
      max-height: 800px;
      opacity: 1;
      margin-top: 10px;
      padding-top: 10px;
      border-color: rgba(90, 167, 255, 0.2);
      transition: max-height 0.4s ease 0.4s, opacity 0.4s ease 0.4s, margin-top 0.2s ease 0.4s, padding-top 0.2s ease 0.4s, border-color 0.2s ease 0.4s;
    }
    .sub-item {
      font-size: 12.5px;
      color: #c0cdf0;
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(0,0,0,0.3);
      transition: background 0.2s, color 0.2s;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sub-item:hover { background: rgba(90, 167, 255, 0.2); color: #fff; }
    
    .path-parent { 
      color: var(--breadcrumb-green); 
      font-size: 12px; 
      font-weight: 600; 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
      word-break: break-word;
    }
    
    .card h3 { margin: 2px 0 0; font-size: 20px; }
    .card h3 a { color: var(--accent); text-decoration: none; }
    .card h3 a:hover { opacity: 0.85; }
    
    .snippet { 
      color: #c0cdf0; 
      font-size: 14.5px; 
      line-height: 1.4; 
      margin-top: 10px; 
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 800px;
      overflow-y: auto;
      background: rgba(4, 8, 16, 0.55); 
      padding: 16px 20px;
      border-radius: 10px;
      border: 1px solid rgba(90, 167, 255, 0.25);
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.4);
      flex-grow: 1;
    }

    .snippet a { color: var(--accent); text-decoration: underline; }

    .snippet .img-container {
      display: block; 
      width: 100%;
      margin: 4px 0; 
      padding: 0;
      clear: both;
    }

    .snippet img {
      max-width: 280px; 
      max-height: 160px;
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: left;
      display: block;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      margin: 0; 
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .snippet img:hover { transform: scale(1.02); border-color: var(--accent); }

    .img-fallback-msg { display: none; font-size: 12px; color: #ffc107; background: rgba(255, 193, 7, 0.1); border: 1px dashed rgba(255, 193, 7, 0.4); padding: 6px 10px; border-radius: 6px; }
    .img-container.img-failed img { display: none; }
    .img-container.img-failed .img-fallback-msg { display: block; }

    .img-modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 300; cursor: pointer; }
    .img-modal-content { max-width: 90vw; max-height: 90vh; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid var(--border); }

    .snippet::-webkit-scrollbar { width: 6px; }
    .snippet::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
    .snippet::-webkit-scrollbar-thumb { background: rgba(90, 167, 255, 0.3); border-radius: 4px; }

    mark { background: rgba(90, 167, 255, 0.25); color: #5aa7ff; font-weight: 700; padding: 1px 3px; border-radius: 3px; border: 1px solid rgba(90, 167, 255, 0.4); box-shadow: none; display: inline-block; line-height: 1.1; }

    .count { color: var(--muted); font-size: 13px; margin-top: 10px; }
    .ocr-status { color: var(--breadcrumb-green); font-size: 13px; margin-top: 6px; font-weight: 500; display: none; }

    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; max-width: 800px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 14px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { margin: 0; font-size: 18px; color: var(--text); }
    .modal-close { background: transparent; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
    .modal-body label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; font-weight: 600; }
    .modal-body select, .modal-body input[type="text"], .modal-body textarea { width: 100%; background: #0b0f19; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 14px; outline: none; margin-bottom: 12px; }
    .modal-body textarea { min-height: 120px; resize: vertical; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; }
    .btn-submit { background: var(--accent); color: #000; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-cancel { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 10px 18px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">Central de Conhecimento - Suporte Cloud (RM)</div>
      <div class="actions-top">
        <button class="btn-action" onclick="abrirModalFeedback()">➕ Enviar Documentação</button>
      </div>
    </div>
    <form class="searchRow" onsubmit="event.preventDefault(); return false;">
      <div class="search-input-wrapper">
        <input id="q" type="text" class="search-box" placeholder="Buscar por erro, banco de dados, parâmetro... ou cole (Ctrl+V) um print" autocomplete="off" />
        <div class="btn-clear-search" id="btnClearSearch" title="Remover destaques e limpar busca">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </div>
      </div>
      <button type="button" class="btn-action" onclick="document.getElementById('fileInput').click()">
        📷 Anexar Print
      </button>
      <input type="file" id="fileInput" accept="image/*" />
    </form>
    
    <div class="ocr-status" id="ocrStatus">Processando imagem e lendo texto do erro...</div>
    <div class="count" id="count">Carregando índice...</div>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="gridWrapper"></div>
  </div>
</main>

<div class="modal-backdrop" id="modalFeedback">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Enviar Documentação</h3>
      <button class="modal-close" onclick="fecharModalFeedback()">&times;</button>
    </div>
    <div class="modal-body">
      <label for="fbAutor">Seu Nome:</label>
      <input type="text" id="fbAutor" placeholder="Ex: João Silva" />

      <label for="fbTipo">Tipo:</label>
      <select id="fbTipo">
        <option value="Nova Documentação">Nova Documentação</option>
        <option value="Correção de Documentação Existente">Correção de Documentação Existente</option>
      </select>

      <label for="fbDoc">Assunto</label>
      <input type="text" id="fbDoc" placeholder="Ex: Portal MeuRH" />
      
      <label for="fbTicket">Ticket de referência</label>
      <input type="text" id="fbTicket" placeholder="Ex: #12345678" />

      <label for="fbEditor">Detalhamento e número de ticket para referência</label>
      <textarea id="fbEditor" placeholder="Apenas texto..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModalFeedback()">Cancelar</button>
      <button class="btn-submit" id="btnEnviarFb" onclick="enviarFeedbackWebhook()">Enviar</button>
    </div>
  </div>
</div>

<div class="img-modal-backdrop" id="imgModal" onclick="fecharModalImagem()">
  <img class="img-modal-content" id="imgModalSrc" src="" alt="Imagem Ampliada" />
</div>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="./docs.js"></script>

<script>
  const SENHA_CORRETA = "redondo";

  function autenticar() {
    const acessoSalvo = sessionStorage.getItem("acesso_central_cloud");
    if (acessoSalvo === btoa(SENHA_CORRETA)) return true;

    const senhaDigitada = prompt("Central de Conhecimento - Suporte Cloud (RM)\n\nPor favor, digite a senha de acesso:");
    if (senhaDigitada && senhaDigitada.trim().toLowerCase() === SENHA_CORRETA) {
      sessionStorage.setItem("acesso_central_cloud", btoa(SENHA_CORRETA));
      return true;
    } else {
      alert("Senha incorreta! Acesso negado.");
      document.body.innerHTML = "<h2 style='color:white; text-align:center; margin-top:50px;'>Acesso negado. Recarregue a página para tentar novamente.</h2>";
      return false;
    }
  }

  function escapeRegExp(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  if (autenticar()) {
    const DOCS = (typeof DATA !== 'undefined' && DATA.docs) ? DATA.docs : [];
    const gridWrapper = document.getElementById('gridWrapper');
    const q = document.getElementById('q');
    const btnClearSearch = document.getElementById('btnClearSearch');
    const count = document.getElementById('count');
    const fileInput = document.getElementById('fileInput');
    const ocrStatus = document.getElementById('ocrStatus');

    const MENU_PRINCIPAL = [
      "SUPORTE", "RM", "PORTAIS", "INTEGRAÇÕES", "BANCO DE DADOS",
      "RÉPLICA", "ATUALIZAÇÃO", "CUSTOMIZAÇÃO", "EXECUÇÃO DE SCRIPTS", "DISPONIBILIZAÇÃO DE BACKUP",
      "FTP", "GO GLOBAL", "TOTVS AUDIT", "LICENSE SERVER", "IMPORTAÇÃO DE ARQUIVO", "LIBERAÇÃO DE ACESSO EXTERNO",
      "PVI", "FLUIG", "T-CLOUD", "SMART VIEW", "FAST ANALYTICS", "FISCAL SYNC",
      "DESEMPENHO", "DISPONIBILIDADE", "REINSTALAÇÃO / MSI", "TURING / INCIDENTE", "TDNs", "OUTROS ATENDIMENTOS"
    ];

    const STOP_WORDS = new Set([
      "de", "da", "do", "das", "dos", "ao", "aos", "em", "no", "na", "nos", "nas", 
      "por", "para", "com", "um", "uma", "o", "a", "os", "as", "se", "nao", "foi", 
      "que", "ha", "este", "esta", "and", "or", "to", "in", "for", "with", "of"
    ]);

    function cleanText(s) {
      if (!s) return '';
      return s
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function removeUrlsFromText(text) {
      if (!text) return '';
      return text.replace(/https?:\/\/[^\s<)]+/gi, '');
    }

    function getKeywords(text) {
      const clean = cleanText(text);
      return clean
        .split(' ')
        .filter(w => w.length >= 2 && !STOP_WORDS.has(w));
    }

    function getStem(word) {
      if (!word || word.length < 4) return word;
      return word.substring(0, Math.min(5, word.length));
    }

    const searchDocs = DOCS.map(d => {
      const textWithoutUrls = removeUrlsFromText(d.text);
      const titleKws = getKeywords(d.title);
      return {
        ...d,
        cleanTitle: cleanText(d.title),
        cleanTitleNoStopwords: titleKws.join(' '),
        cleanText: cleanText(textWithoutUrls),
        rawTextClean: cleanText(d.text),
        cleanPath: cleanText(d.path || d.title),
        titleKeywords: titleKws,
        textKeywords: getKeywords(textWithoutUrls)
      };
    });

    const fuse = new Fuse(searchDocs, {
      keys: [
        { name: 'cleanTitleNoStopwords', weight: 0.99 },
        { name: 'cleanText', weight: 0.01 }
      ],
      threshold: 0.4,
      ignoreLocation: true,
      minMatchCharLength: 2,
      useExtendedSearch: true
    });

    function getParentPathOnly(doc) {
      const fullPath = doc.path || doc.title || '';
      const parts = fullPath.split(' > ');
      if (parts.length <= 1) return 'SUPORTE'; 
      parts.pop(); 
      return parts.join(' > ');
    }

    function getScore(d, rawQuery) {
      if (!rawQuery) return 0;
      let score = 0;

      const exactSearch = rawQuery.toLowerCase().trim();
      const docTitleRaw = (d.title || "").toLowerCase();
      const docTextRaw = (d.text || "").toLowerCase();
      const exactNoHyphen = exactSearch.replace(/-/g, ' ');

      if (exactSearch.length >= 3) {
          if (docTitleRaw === exactSearch || docTitleRaw === exactNoHyphen) score += 2000000000;
          else if (docTitleRaw.includes(exactSearch) || docTitleRaw.includes(exactNoHyphen)) score += 100000000;
          if (docTextRaw.includes(exactSearch) || docTextRaw.includes(exactNoHyphen)) score += 50000000;
      }

      const cleanQ = cleanText(rawQuery);
      const queryWords = getKeywords(rawQuery);
      if (queryWords.length === 0) return score; 

      const titleClean = d.cleanTitleNoStopwords;
      const docTextKeywordsStr = d.textKeywords.join(' '); 

      let titleMatchedWords = 0;
      for (const word of queryWords) {
        if (titleClean.includes(word)) titleMatchedWords++;
      }

      const ratioTitle = titleMatchedWords / queryWords.length;
      if (ratioTitle >= 0.3) {
        score += Math.pow(titleMatchedWords, 4) * 5000000;
      }

      if (queryWords.length >= 2) {
        for (let i = 0; i <= queryWords.length - 2; i++) {
          const pair = queryWords.slice(i, i + 2).join(' ');
          if (titleClean.includes(pair)) {
            score += 100000000;
          }
        }
      }

      let longestSeq = 0;
      for(let len = Math.min(queryWords.length, 15); len >= 2; len--) {
          for(let i = 0; i <= queryWords.length - len; i++) {
              const phrase = queryWords.slice(i, i+len).join(' ');
              if (docTextKeywordsStr.includes(phrase)) {
                  if (len > longestSeq) longestSeq = len;
              }
          }
          if (longestSeq > 0) break; 
      }
      
      if (longestSeq >= 4) {
          score += Math.pow(longestSeq, 5) * 5000000; 
      } else if (longestSeq === 3) {
          score += 500000;
      } else if (longestSeq === 2) {
          score += 50000;
      }

      if (cleanQ.length > 5 && d.cleanText.includes(cleanQ)) {
        score += 10000;
      }
      
      let maxWordsInWindow = 0;
      const windowSize = 250;

      for (let i = 0; i < d.cleanText.length; i += 80) {
        const textSlice = d.cleanText.substring(i, i + windowSize);
        let countExact = 0;

        for (const word of queryWords) {
          if (textSlice.includes(word)) countExact++;
        }

        if (countExact > maxWordsInWindow) {
          maxWordsInWindow = countExact;
        }
      }

      if (maxWordsInWindow >= 2) {
        score += Math.pow(maxWordsInWindow, 3) * 500;
      }

      return score;
    }

    function buildAccentRegex(term) {
      const charMap = {
        'a': '[aáàâãä]', 'e': '[eéèêë]', 'i': '[iíìîï]',
        'o': '[oóòôõö]', 'u': '[uúùûü]', 'c': '[cç]'
      };
      const escaped = escapeRegExp(term.toLowerCase());
      const pattern = escaped.split('').map(c => charMap[c] || c).join('');
      return new RegExp(pattern.replace(/ /g, '[\\s\\-]+'), 'gi');
    }

    function formatSnippetText(snippetHtml) {
      if (!snippetHtml) return '';

      let formatted = snippetHtml.replace(
        /\s*!\[Imagem\]\(([^)]+)\)\s*/g,
        `<div class="img-container"><img src="$1" alt="Imagem da Documentação" onerror="this.onerror=null; this.parentElement.classList.add('img-failed');" onclick="ampliarImagem('$1')" title="Clique para ampliar" /><div class="img-fallback-msg">⚠️ Imagem pendente de carregamento no servidor</div></div>`
      );

      formatted = formatted.replace(
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener">$1</a>'
      );

      const urlRegex = /(?<!href=")(?<!src=")(https?:\/\/[^\s<)]+)/g;
      return formatted.replace(urlRegex, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    }

    function highlightSnippetHtml(htmlContent, rawQuery) {
      if (!htmlContent || !rawQuery) return htmlContent;

      const cleanQ = cleanText(rawQuery);
      const queryWords = cleanQ.split(/\s+/).filter(w => w.length >= 2 && !STOP_WORDS.has(w));
      const wordsToHighlight = [cleanQ];
      
      if (rawQuery.trim().length >= 3) wordsToHighlight.push(rawQuery.trim());
      if (queryWords.length > 1) wordsToHighlight.push(...queryWords);

      let highlighted = htmlContent;
      for (const word of wordsToHighlight) {
        if (word.length < 2) continue;
        try {
          const regHighlight = buildAccentRegex(word);
          highlighted = highlighted.replace(/(<[^>]+>)|([^<]+)/g, (match, tag, text) => {
            if (tag) return tag;
            return text.replace(regHighlight, '<mark>$&</mark>');
          });
        } catch (e) {}
      }

      return highlighted;
    }

    function getSnippet(text, rawQuery) {
      if (!text) return '';
      if (!rawQuery) return formatSnippetText(text.substring(0, 650) + (text.length > 650 ? '...' : ''));

      const cleanQ = cleanText(rawQuery);
      const queryWords = cleanQ.split(/\s+/).filter(w => w.length >= 2 && !STOP_WORDS.has(w));

      let matchIndex = -1;

      if (queryWords.length >= 2) {
        let bestCount = 0;
        const windowSize = 350; 
        const maxI = Math.max(0, text.length - windowSize);
        
        for (let i = 0; i <= maxI; i += 40) {
          const slice = text.substring(i, i + windowSize);
          
          const isUrl = /^https?:\/\//i.test(slice.trim());
          if (isUrl) continue;

          let count = 0;
          const cSlice = cleanText(slice); 
          for (const w of queryWords) {
            if (cSlice.includes(w)) count++;
          }
          if (count > bestCount) {
            bestCount = count;
            matchIndex = i;
          }
        }
      }

      if (matchIndex === -1 && queryWords.length > 0) {
        for (const word of queryWords) {
          const idx = text.toLowerCase().indexOf(word);
          if (idx !== -1) {
            matchIndex = idx;
            break;
          }
        }
      }

      if (matchIndex === -1) {
        return formatSnippetText(text.substring(0, 650) + (text.length > 650 ? '...' : ''));
      }

      const start = Math.max(0, matchIndex - 70);
      const end = Math.min(text.length, matchIndex + 2000);
      let snippet = (start > 0 ? '...' : '') + text.substring(start, end) + (end < text.length ? '...' : '');

      const formattedHtml = formatSnippetText(snippet);
      return highlightSnippetHtml(formattedHtml, rawQuery);
    }

    function render() {
      const rawQuery = q.value.trim();
      btnClearSearch.style.display = rawQuery ? 'flex' : 'none';

      if (!rawQuery) {
        let inicialDocs = [];
        
        MENU_PRINCIPAL.forEach(titulo => {
           const searchTitle = cleanText(titulo);
           
           let matches = searchDocs.filter(d => d.cleanTitle === searchTitle);
           if (matches.length === 0) {
               matches = searchDocs.filter(d => d.cleanTitle.endsWith(searchTitle));
           }
           if (matches.length === 0) {
               matches = searchDocs.filter(d => d.cleanTitle.includes(searchTitle));
           }
           
           if (matches.length > 0) {
               matches.sort((a,b) => (a.path||'').length - (b.path||'').length);
               const parentDoc = matches[0];
               
               const filhos = searchDocs.filter(d => {
                   const pPath = getParentPathOnly(d);
                   return pPath.endsWith(parentDoc.title);
               });

               let filhosHtml = '';
               if(filhos.length > 0) {
                   filhosHtml = `<div class="thumb-sub-list">` + 
                       filhos.map(f => `<a href="${f.url || '#'}" target="_blank" rel="noopener" class="sub-item" onclick="event.stopPropagation()">📄 ${f.title}</a>`).join('')
                       + `</div>`;
               }

               htmlMenu = `
                 <div class="card-thumb" onclick="if(event.target.tagName !== 'A') window.open('${parentDoc.url || '#'}', '_blank')" title="${parentDoc.title}">
                   <div class="thumb-path">${getParentPathOnly(parentDoc)}</div>
                   <div class="thumb-title">${titulo}</div>
                   ${filhosHtml}
                 </div>
               `;
               
               if (!inicialDocs.some(doc => doc.id === parentDoc.id)) {
                   inicialDocs.push({ id: parentDoc.id, html: htmlMenu });
               }
           }
        });

        gridWrapper.className = 'grid-thumbnails';
        gridWrapper.innerHTML = inicialDocs.map(d => d.html).join('');
        count.textContent = `Páginas principais em atalho.`;
        return; 
      }

      gridWrapper.className = 'grid';

      const scoredDocs = searchDocs.map(d => ({
        ...d,
        _score: getScore(d, rawQuery)
      }));

      const directMatches = scoredDocs
        .filter(d => d._score > 0)
        .sort((a, b) => b._score - a._score);

      const queryWords = getKeywords(rawQuery);
      const cleanSearchQuery = queryWords.join(' ');

      let fuseMatches = [];
      if (directMatches.length === 0 || directMatches[0]._score < 1000000) {
        fuseMatches = fuse.search(cleanSearchQuery || rawQuery)
          .map(r => r.item)
          .filter(d => !directMatches.some(dm => dm.id === d.id));
      }

      const results = [...directMatches, ...fuseMatches];

      gridWrapper.innerHTML = results.map(d => {
        const parentPath = getParentPathOnly(d);
        const snippetContent = getSnippet(d.text, rawQuery);
        return `
          <div class="card">
            ${parentPath ? `<div class="path-parent">${parentPath}</div>` : ''}
            <h3><a href="${d.url || '#'}" target="_blank" rel="noopener">${d.title}</a></h3>
            <div class="snippet">${snippetContent}</div>
          </div>
        `;
      }).join('');

      count.textContent = `${results.length} resultado(s) encontrado(s)`;
    }

    async function processarImagemOCR(imageSource) {
      ocrStatus.style.display = "block";
      ocrStatus.textContent = "Processando imagem do erro via OCR...";

      try {
        const worker = await Tesseract.createWorker('por');
        const ret = await worker.recognize(imageSource);
        await worker.terminate();

        let rawText = ret.data.text || "";

        let cleanTextStr = rawText
          .replace(/[\r\n]+/g, ' ')
          .replace(/[^a-zA-Z0-9áàâãéèêíïóôõöúçÑñÁÀÂÃÉÈÍÏÓÔÕÖÚ\s]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();

        const palavrasRelevantes = cleanTextStr.split(' ').filter(word => {
          const wClean = cleanText(word);
          return wClean.length >= 2 && !STOP_WORDS.has(wClean);
        });

        const textoLido = palavrasRelevantes.join(' ');

        if (textoLido.length > 0) {
          q.value = textoLido;
          render();
          ocrStatus.textContent = "Texto extraído com sucesso!";
        } else {
          ocrStatus.textContent = "Nenhum texto relevante foi identificado.";
        }
      } catch (err) {
        console.error(err);
        ocrStatus.textContent = "Erro ao processar imagem de erro.";
      }

      setTimeout(() => { ocrStatus.style.display = "none"; }, 4000);
    }

    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        processarImagemOCR(e.target.files[0]);
      }
    });

    document.addEventListener('paste', (e) => {
      const modalVisivel = document.getElementById('modalFeedback').style.display === 'flex';
      if (!modalVisivel) {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (const item of items) {
          if (item.type.indexOf("image") === 0) {
            const blob = item.getAsFile();
            processarImagemOCR(blob);
            break;
          }
        }
      }
    });

    btnClearSearch.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      
      q.value = '';
      btnClearSearch.style.display = 'none';
      
      const marks = document.getElementById('gridWrapper').querySelectorAll('mark');
      marks.forEach(mark => {
        const parent = mark.parentNode;
        const textNode = document.createTextNode(mark.textContent);
        parent.replaceChild(textNode, mark);
        parent.normalize(); 
      });
    });

    let debounceTimer;
    q.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(render, 600); 
    });

    count.textContent = `${DOCS.length} documentações carregadas.`;
    render();
  }

  function ampliarImagem(url) {
    const modal = document.getElementById('imgModal');
    const modalImg = document.getElementById('imgModalSrc');
    if (modal && modalImg) {
      modalImg.src = url;
      modal.style.display = 'flex';
    }
  }

  function fecharModalImagem() {
    const modal = document.getElementById('imgModal');
    if (modal) {
      modal.style.display = 'none';
    }
  }

  function abrirModalFeedback() {
    document.getElementById('modalFeedback').style.display = 'flex';
  }

  function fecharModalFeedback() {
    document.getElementById('modalFeedback').style.display = 'none';
    document.getElementById('fbEditor').value = '';
    document.getElementById('fbDoc').value = '';
    document.getElementById('fbTicket').value = '';
  }

  async function enviarFeedbackWebhook() {
    const autor = document.getElementById('fbAutor').value.trim();
    const tipo = document.getElementById('fbTipo').value;
    const doc = document.getElementById('fbDoc').value.trim();
    const ticket = document.getElementById('fbTicket').value.trim();
    const texto = document.getElementById('fbEditor').value.trim();
    const btnSubmit = document.getElementById('btnEnviarFb');

    if (!autor) { alert("Por favor, preencha o seu Nome."); return; }

    btnSubmit.disabled = true;
    btnSubmit.textContent = "⏳ Enviando...";

    const payload = { autor, tipo, doc, ticket, texto, data: new Date().toISOString() };

    try {
      const URL_WEBHOOK = "https://hook.us2.make.com/zc6poqt4l48vtgcyhwbnyj5ziuktpm74";
      await fetch(URL_WEBHOOK, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      alert("🎉 Sua documentação foi enviada com sucesso para a fila de avaliação!");
      fecharModalFeedback();
    } catch (erro) {
      alert("Erro ao enviar. Verifique sua conexão e tente novamente.");
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.textContent = "Enviar";
    }
  }
</script>
