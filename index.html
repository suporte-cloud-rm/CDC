<!doctype html>
<html lang="pt-BR">
<head>
  <meta name="robots" content="noindex, nofollow" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Central de Conhecimento - Suporte Cloud (RM)</title>
  <style>
    :root {
      --bg: #0b0f19; 
      --card: #121a2a; 
      --muted: #9aa7bd; 
      --text: #e8eefc;
      --accent: #5aa7ff;
      --highlight: #ffffff; 
      --border: rgba(90, 167, 255, 0.15);
      --breadcrumb-green: #20c997;
      --danger: #ff5252;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
    header { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px); background: rgba(11,15,25,.85); border-bottom: 1px solid var(--border); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .top { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .brand { font-weight: 700; font-size: 18px; }
    
    .actions-top { display: flex; gap: 8px; align-items: center; }

    .btn-action {
      background: #1a263d;
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-action:hover { background: #223250; border-color: rgba(90, 167, 255, 0.4); }
    .btn-action:disabled { opacity: 0.6; cursor: not-allowed; }

    .searchRow { display: flex; gap: 10px; margin-top: 12px; align-items: center; position: relative; }
    
    .search-input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      margin: 0;
      padding: 0;
    }

    input.search-box { 
      width: 100%; 
      background: var(--card); 
      color: var(--text); 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      padding: 12px 38px 12px 14px; 
      outline: none; 
      font-size: 15px; 
    }

    .btn-clear-search {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .btn-clear-search:hover { color: var(--text); }

    #fileInput { display: none; }

    main { padding: 18px 0 40px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    
    .card { 
      background: var(--card); 
      border: 1px solid var(--border); 
      border-radius: 14px; 
      padding: 20px 24px; 
      display: flex; 
      flex-direction: column; 
      gap: 4px; 
      transition: border-color 0.2s ease;
    }
    .card:hover { border-color: rgba(90, 167, 255, 0.4); }
    
    .path-parent { 
      color: var(--breadcrumb-green); 
      font-size: 12px; 
      font-weight: 600; 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
      word-break: break-word;
    }
    
    .card h3 { margin: 2px 0 0; font-size: 18px; }
    .card h3 a { color: var(--accent); text-decoration: none; }
    .card h3 a:hover { opacity: 0.85; }
    
    .snippet { 
      color: #c0cdf0; 
      font-size: 14px; 
      line-height: 1.5; 
      margin-top: 8px; 
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 600px;
      overflow-y: auto;
      background: rgba(4, 8, 16, 0.55); 
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(90, 167, 255, 0.25);
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.4);
    }

    .snippet a { color: var(--accent); text-decoration: underline; }

    .snippet .img-container { display: block; margin: 6px 0; position: relative; }
    .snippet img { max-width: 380px; max-height: 240px; object-fit: cover; display: block; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.15); cursor: pointer; margin: 4px 0; transition: transform 0.2s ease, border-color 0.2s ease; }
    .snippet img:hover { transform: scale(1.02); border-color: var(--accent); }

    .img-fallback-msg { display: none; font-size: 12px; color: #ffc107; background: rgba(255, 193, 7, 0.1); border: 1px dashed rgba(255, 193, 7, 0.4); padding: 6px 10px; border-radius: 6px; }
    .img-container.img-failed img { display: none; }
    .img-container.img-failed .img-fallback-msg { display: block; }

    .img-modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 300; cursor: pointer; }
    .img-modal-content { max-width: 90vw; max-height: 90vh; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid var(--border); }

    .snippet::-webkit-scrollbar { width: 6px; }
    .snippet::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
    .snippet::-webkit-scrollbar-thumb { background: rgba(90, 167, 255, 0.3); border-radius: 4px; }

    mark { background: rgba(90, 167, 255, 0.25); color: #5aa7ff; font-weight: 700; padding: 1px 3px; border-radius: 3px; border: 1px solid rgba(90, 167, 255, 0.4); box-shadow: none; display: inline-block; line-height: 1.1; }

    .count { color: var(--muted); font-size: 13px; margin-top: 10px; }
    .ocr-status { color: var(--breadcrumb-green); font-size: 13px; margin-top: 6px; font-weight: 500; display: none; }

    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 200; }
    .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 14px; max-height: 90vh; overflow-y: auto;}
    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { margin: 0; font-size: 18px; color: var(--text); }
    .modal-close { background: transparent; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
    
    .modal-body label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; font-weight: 600; }
    .modal-body select, .modal-body input[type="text"], .modal-body textarea { width: 100%; background: #0b0f19; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 14px; outline: none; margin-bottom: 12px; font-family: inherit; }
    .modal-body textarea { min-height: 120px; resize: vertical; line-height: 1.5; }

    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; }
    .btn-submit { background: var(--accent); color: #000; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-cancel { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 10px 18px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">Central de Conhecimento - Suporte Cloud (RM)</div>
      <div class="actions-top">
        <button class="btn-action" onclick="abrirModalFeedback()">
          ➕ Enviar Documentação
        </button>
      </div>
    </div>
    <form class="searchRow" onsubmit="event.preventDefault(); return false;">
      <div class="search-input-wrapper">
        <input id="q" type="text" class="search-box" placeholder="Buscar por erro, banco de dados, parâmetro... ou cole (Ctrl+V) um print" autocomplete="off" />
        <div class="btn-clear-search" id="btnClearSearch" title="Remover destaques e limpar busca">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </div>
      </div>
      <button type="button" class="btn-action" onclick="document.getElementById('fileInput').click()">
        📷 Anexar Print
      </button>
      <input type="file" id="fileInput" accept="image/*" />
    </form>
    
    <div class="ocr-status" id="ocrStatus">Processando imagem e lendo texto do erro...</div>
    <div class="count" id="count">Carregando índice...</div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="grid" id="grid"></div>
  </div>
</main>

<!-- Modal de Envio (Text Only) -->
<div class="modal-backdrop" id="modalFeedback">
  <div class="modal-box" style="max-width: 800px; width: 90%;">
    <div class="modal-header">
      <h3>Enviar Documentação</h3>
      <button class="modal-close" onclick="fecharModalFeedback()">&times;</button>
    </div>
    <div class="modal-body">
      <label for="fbAutor">Seu Nome:</label>
      <input type="text" id="fbAutor" placeholder="Ex: João Silva" />

      <label for="fbTipo">Tipo:</label>
      <select id="fbTipo">
        <option value="Nova Documentação">Nova Documentação</option>
        <option value="Correção de Documentação Existente">Correção de Documentação Existente</option>
      </select>

      <label for="fbDoc">Assunto</label>
      <input type="text" id="fbDoc" placeholder="Ex: Portal MeuRH" />
      
      <label for="fbTicket">Ticket de referência</label>
      <input type="text" id="fbTicket" placeholder="Ex: #12345678" />

      <label for="fbEditor">Deixe aqui o detalhamento e número de ticket para referência (caso se aplique)</label>
      <textarea id="fbEditor" placeholder="Apenas texto..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModalFeedback()">Cancelar</button>
      <button class="btn-submit" id="btnEnviarFb" onclick="enviarFeedbackWebhook()">Enviar</button>
    </div>
  </div>
</div>

<div class="img-modal-backdrop" id="imgModal" onclick="fecharModalImagem()">
  <img class="img-modal-content" id="imgModalSrc" src="" alt="Imagem Ampliada" />
</div>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="./docs.js"></script>

<script>
  const HASH_SESSAO = "cmVkb25kbw==";

  function autenticar() {
    const acessoSalvo = sessionStorage.getItem("acesso_central_cloud");
    if (acessoSalvo === HASH_SESSAO) return true;

    const senhaDigitada = prompt("Central de Conhecimento - Suporte Cloud (RM)\n\nPor favor, digite a senha de acesso:");
    
    if (senhaDigitada && btoa(senhaDigitada.trim().toLowerCase()) === HASH_SESSAO) {
      sessionStorage.setItem("acesso_central_cloud", HASH_SESSAO);
      return true;
    } else {
      sessionStorage.removeItem("acesso_central_cloud");
      alert("Senha incorreta! Acesso negado.");
      document.body.innerHTML = "<h2 style='color:white; text-align:center; margin-top:50px;'>Acesso negado. Recarregue a página para tentar novamente.</h2>";
      return false;
    }
  }

  function escapeRegExp(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  if (autenticar()) {
    const DOCS = (typeof DATA !== 'undefined' && DATA.docs) ? DATA.docs : [];
    const grid = document.getElementById('grid');
    const q = document.getElementById('q');
    const btnClearSearch = document.getElementById('btnClearSearch');
    const count = document.getElementById('count');
    const fileInput = document.getElementById('fileInput');
    const ocrStatus = document.getElementById('ocrStatus');

    const STOP_WORDS = new Set(["de", "da", "do", "das", "dos", "ao", "aos", "em", "na", "nos", "nas", "por", "para", "com", "um", "uma", "o", "a", "os", "as", "se", "foi", "que", "ha", "este", "esta", "and", "or", "to", "in", "for", "with", "of", "vw", "atencao"]);

    function cleanText(s) {
      if (!s) return '';
      return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function removeUrlsFromText(text) { return text ? text.replace(/https?:\/\/[^\s<)]+/gi, '') : ''; }
    function getKeywords(text) { return cleanText(text).split(' ').filter(w => w.length >= 2 && !STOP_WORDS.has(w)); }
    function getStem(word) { return (!word || word.length < 4) ? word : word.substring(0, Math.min(5, word.length)); }

    const searchDocs = DOCS.map(d => {
      const textWithoutUrls = removeUrlsFromText(d.text);
      const titleKws = getKeywords(d.title);
      return {
        ...d,
        cleanTitleNoStopwords: titleKws.join(' '),
        cleanText: cleanText(textWithoutUrls),
      };
    });

    const fuse = new Fuse(searchDocs, {
      keys: [{ name: 'cleanTitleNoStopwords', weight: 0.99 }, { name: 'cleanText', weight: 0.01 }],
      threshold: 0.4, ignoreLocation: true, minMatchCharLength: 2, useExtendedSearch: true
    });

    function getScore(d, rawQuery) {
      if (!rawQuery) return 0;
      const cleanQ = cleanText(rawQuery);
      const queryWords = getKeywords(rawQuery);
      if (queryWords.length === 0) return 0;

      let score = 0;
      const titleClean = d.cleanTitleNoStopwords;

      let titleMatchedWords = 0;
      for (const word of queryWords) { if (titleClean.includes(word)) titleMatchedWords++; }

      if (titleMatchedWords / queryWords.length >= 0.3) score += Math.pow(titleMatchedWords, 4) * 5000000;

      if (queryWords.length >= 2) {
        for (let i = 0; i <= queryWords.length - 2; i++) {
          if (titleClean.includes(queryWords.slice(i, i + 2).join(' '))) score += 100000000;
        }
      }

      let longestSeq = 0;
      for(let len = Math.min(queryWords.length, 15); len >= 3; len--) {
          for(let i = 0; i <= queryWords.length - len; i++) {
              if (d.cleanText.includes(queryWords.slice(i, i+len).join(' '))) {
                  if (len > longestSeq) longestSeq = len;
              }
          }
          if (longestSeq > 0) break;
      }
      
      if (longestSeq >= 4) score += Math.pow(longestSeq, 5) * 50000000; 
      else if (longestSeq === 3) score += 5000000;

      if (cleanQ.length > 5 && d.cleanText.includes(cleanQ)) score += 10000;
      
      let maxWordsInWindow = 0;
      for (let i = 0; i < d.cleanText.length; i += 80) {
        let countExact = 0;
        const textSlice = d.cleanText.substring(i, i + 250);
        for (const word of queryWords) { if (textSlice.includes(word)) countExact++; }
        if (countExact > maxWordsInWindow) maxWordsInWindow = countExact;
      }
      if (maxWordsInWindow >= 2) score += Math.pow(maxWordsInWindow, 3) * 500;

      return score;
    }

    function getParentPathOnly(doc) {
      const parts = (doc.path || doc.title || '').split(' > ');
      if (parts.length <= 1) return ''; 
      parts.pop(); 
      return parts.join(' > ');
    }

    function buildAccentRegex(term) {
      const charMap = { 'a': '[aáàâãä]', 'e': '[eéèêë]', 'i': '[iíìîï]', 'o': '[oóòôõö]', 'u': '[uúùûü]', 'c': '[cç]' };
      const pattern = escapeRegExp(term.toLowerCase()).split('').map(c => charMap[c] || c).join('');
      return new RegExp(pattern, 'gi');
    }

    function formatSnippetText(snippetText) {
      if (!snippetText) return '';
      let formatted = snippetText.replace(/[\r\n]{2,}(!\[Imagem\])/g, '\n$1').replace(/(!\[Imagem\]\([^)]+\))[\r\n]{2,}/g, '$1\n');
      formatted = formatted.replace(/!\[Imagem\]\(([^)]+)\)/g, `<div class="img-container"><img src="$1" alt="Imagem da Documentação" onerror="this.onerror=null; this.parentElement.classList.add('img-failed');" onclick="ampliarImagem('$1')" title="Clique para ampliar" /><div class="img-fallback-msg">⚠️ Imagem pendente de carregamento no servidor</div></div>`);
      formatted = formatted.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      return formatted.replace(/(?<!href=")(?<!src=")(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    }

    function highlightSnippetHtml(htmlContent, rawQuery) {
      if (!htmlContent || !rawQuery) return htmlContent;
      const queryWords = cleanText(rawQuery).split(/\s+/).filter(w => w.length >= 2 && !STOP_WORDS.has(w));
      const wordsToHighlight = queryWords.length > 0 ? queryWords : [cleanText(rawQuery)];
      let highlighted = htmlContent;
      for (const word of wordsToHighlight) {
        try {
          highlighted = highlighted.replace(/(<[^>]+>)|([^<]+)/g, (match, tag, text) => {
            if (tag) return tag;
            return text.replace(buildAccentRegex(word), '<mark>$&</mark>');
          });
        } catch (e) {}
      }
      return highlighted;
    }

    function getSnippet(text, rawQuery) {
      if (!text) return '';
      if (!rawQuery) return formatSnippetText(text.substring(0, 1500) + (text.length > 1500 ? '...' : ''));

      const queryWords = cleanText(rawQuery).split(/\s+/).filter(w => w.length >= 2 && !STOP_WORDS.has(w));
      let matchIndex = -1;

      if (queryWords.length >= 2) {
        let bestCount = 0;
        for (let i = 0; i <= Math.max(0, text.length - 350); i += 40) {
          const slice = text.substring(i, i + 350);
          if (/^https?:\/\//i.test(slice.trim())) continue;
          let count = 0;
          const cSlice = cleanText(slice); 
          for (const w of queryWords) {
            if (cSlice.includes(w)) count++;
            else if (getStem(w).length >= 4 && cSlice.includes(getStem(w))) count += 0.5;
          }
          if (count > bestCount) { bestCount = count; matchIndex = i; }
        }
      }

      if (matchIndex === -1 && queryWords.length > 0) {
        for (const word of queryWords) {
          const idx = text.toLowerCase().indexOf(word);
          if (idx !== -1) { matchIndex = idx; break; }
        }
      }

      if (matchIndex === -1) return formatSnippetText(text.substring(0, 1500) + (text.length > 1500 ? '...' : ''));

      const start = Math.max(0, matchIndex - 200);
      const end = Math.min(text.length, matchIndex + 1500);
      return highlightSnippetHtml(formatSnippetText((start > 0 ? '...' : '') + text.substring(start, end) + (end < text.length ? '...' : '')), rawQuery);
    }

    function render() {
      const rawQuery = q.value.trim();
      btnClearSearch.style.display = rawQuery ? 'flex' : 'none';

      let results = rawQuery ? searchDocs.map(d => ({ ...d, _score: getScore(d, rawQuery) })) : searchDocs;
      
      if (rawQuery) {
        const directMatches = results.filter(d => d._score > 0).sort((a, b) => b._score - a._score);
        let fuseMatches = (directMatches.length === 0 || directMatches[0]._score < 1000000) 
            ? fuse.search(getKeywords(rawQuery).join(' ') || rawQuery).map(r => r.item).filter(d => !directMatches.some(dm => dm.id === d.id)) 
            : [];
        results = [...directMatches, ...fuseMatches];
      }

      grid.innerHTML = results.map(d => `
        <div class="card">
          ${getParentPathOnly(d) ? `<div class="path-parent">${getParentPathOnly(d)}</div>` : ''}
          <h3><a href="${d.url || '#'}" target="_blank" rel="noopener">${d.title}</a></h3>
          <div class="snippet">${getSnippet(d.text, rawQuery)}</div>
        </div>
      `).join('');

      count.textContent = `${results.length} resultado(s) encontrado(s)`;
    }

    async function processarImagemOCR(imageSource) {
      ocrStatus.style.display = "block"; ocrStatus.textContent = "Processando imagem do erro via OCR...";
      try {
        const worker = await Tesseract.createWorker('por');
        const ret = await worker.recognize(imageSource);
        await worker.terminate();
        const textoLido = (ret.data.text || "").replace(/[\r\n]+/g, ' ').replace(/[^a-zA-Z0-9áàâãéèêíïóôõöúçÑñÁÀÂÃÉÈÍÏÓÔÕÖÚ\s]/g, ' ').replace(/\s+/g, ' ').trim().split(' ').filter(word => cleanText(word).length >= 2 && !STOP_WORDS.has(cleanText(word))).join(' ');

        if (textoLido.length > 0) { q.value = textoLido; render(); ocrStatus.textContent = "Texto extraído com sucesso!"; } 
        else { ocrStatus.textContent = "Nenhum texto relevante foi identificado."; }
      } catch (err) { ocrStatus.textContent = "Erro ao processar imagem de erro."; }
      setTimeout(() => { ocrStatus.style.display = "none"; }, 4000);
    }

    fileInput.addEventListener('change', (e) => { if (e.target.files && e.target.files[0]) processarImagemOCR(e.target.files[0]); });
    
    document.addEventListener('paste', (e) => {
      if (document.getElementById('modalFeedback').style.display !== 'flex') {
        for (const item of (e.clipboardData || e.originalEvent.clipboardData).items) {
          if (item.type.indexOf("image") === 0) { processarImagemOCR(item.getAsFile()); break; }
        }
      }
    });

    q.addEventListener('keydown', (e) => { if (e.key === 'Enter') e.preventDefault(); });
    btnClearSearch.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); q.value = ''; btnClearSearch.style.display = 'none'; document.querySelectorAll('#grid mark').forEach(m => { m.parentNode.replaceChild(document.createTextNode(m.textContent), m); }); render(); });

    let debounceTimer;
    q.addEventListener('input', () => { clearTimeout(debounceTimer); debounceTimer = setTimeout(render, 300); });

    count.textContent = `${DOCS.length} documentações carregadas.`;
    render();
  }

  function ampliarImagem(url) {
    const modal = document.getElementById('imgModal'), modalImg = document.getElementById('imgModalSrc');
    if (modal && modalImg) { modalImg.src = url; modal.style.display = 'flex'; }
  }
  function fecharModalImagem() { document.getElementById('imgModal').style.display = 'none'; }
  function abrirModalFeedback() { document.getElementById('modalFeedback').style.display = 'flex'; }
  function fecharModalFeedback() { 
      document.getElementById('modalFeedback').style.display = 'none';
      document.getElementById('fbEditor').value = '';
      document.getElementById('fbDoc').value = '';
      document.getElementById('fbTicket').value = '';
  }

  async function enviarFeedbackWebhook() {
    const autor = document.getElementById('fbAutor').value.trim();
    const tipo = document.getElementById('fbTipo').value;
    const doc = document.getElementById('fbDoc').value.trim();
    const ticket = document.getElementById('fbTicket').value.trim();
    const texto = document.getElementById('fbEditor').value.trim();
    const btnSubmit = document.getElementById('btnEnviarFb');

    if (!autor) { alert("Por favor, preencha o seu Nome."); return; }

    btnSubmit.disabled = true;
    btnSubmit.textContent = "⏳ Enviando...";

    const payload = { autor, tipo, doc, ticket, texto, data: new Date().toISOString() };
